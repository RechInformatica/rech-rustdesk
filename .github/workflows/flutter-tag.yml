name: Flutter Tag Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-[0-9]+'
      # Padrão de tag do fork Rech Rustdesk, ex.: 1.5.1-r42
      # (ver docs/VERSIONAMENTO.md). Mantido como um padrão a mais, separado
      # dos originais acima, para reduzir conflito em futuros syncs com o
      # upstream nesse mesmo arquivo. Os nomes dos arquivos e as notas da
      # Release são ajustados depois do build por rech-finaliza-release.yml.
      - '[0-9]+.[0-9]+.[0-9]+-r[0-9]+'

jobs:
  run-flutter-tag-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ github.ref_name }}
      publish-update-metadata: ${{ github.repository == 'rustdesk/rustdesk' }}
